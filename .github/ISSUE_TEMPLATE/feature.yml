name: Feature
description: New capability or a build step from the plan
title: "feat: "
labels: ["type: feat"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should exist when this is done? One or two sentences.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem it solves, or the design decision it implements.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable statements. The PR that closes this must satisfy all of them.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / out of scope
      description: Open questions, related issues, and what this deliberately does not do.
