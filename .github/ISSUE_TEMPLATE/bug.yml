name: Bug
description: Something behaves differently from how it should
title: "fix: "
labels: ["type: bug"]
body:
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The observed behaviour. Include the article ID, date, or endpoint if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Or the fixture / ingestion run that shows it.
      value: |
        1.
    validations:
      required: true
  - type: dropdown
    id: history-impact
    attributes:
      label: Does this affect stored price history?
      description: >
        Wrong values can be corrected by re-parsing the raw payload archive.
        Missing days can only be re-fetched for about 3 days, then they are lost for good.
      options:
        - "Not sure yet"
        - "No — code or API only"
        - "Yes — wrong values were written"
        - "Yes — days are missing"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs / evidence
      description: Stack trace, log lines, or an ingestion_run row. Formatted as code automatically.
      render: shell
