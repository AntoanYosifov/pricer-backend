spring.application.name=pricer-backend

spring.datasource.url=jdbc:postgresql://localhost:5433/pricer
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.username=${DB_USERNAME:username}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.open-in-view=false
logging.level.org.hibernate.persister.entity=ERROR


spar.api.price-url=${SPAR_PRICE_URL:}
spar.api.product-url=${SPAR_PRODUCT_URL:}
